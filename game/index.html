<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191a25">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'">
  <title>LANTERNWING — The last light takes flight</title>
  <style>
    :root { color-scheme: dark; font-family: Georgia, 'Times New Roman', serif; color: #ffecd0; background: #10151c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #354043, #10151c 75%); }
    #stage { position: relative; width: min(100vw, 177.7778vh); aspect-ratio: 16 / 9; overflow: hidden; box-shadow: 0 20px 100px #0009; background: #302a35; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #interface { position: absolute; inset: 0; pointer-events: none; }
    #interface:empty { display: none; }
    .screen { pointer-events: auto; position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 4.7% 6%; background: linear-gradient(90deg, #101b26f5, #18242be0 54%, #18242b58); }
    .screen.wide { background: #101b26f2; justify-content: flex-start; padding-top: 3.4%; }
    .eyebrow, button, .tag, .small, .stats, .card span, .help { font-family: 'Trebuchet MS', Arial, sans-serif; }
    .eyebrow { color: #ffc882; letter-spacing: .25em; font-size: clamp(9px, 1.1vw, 15px); text-transform: uppercase; margin: 0 0 1.2em; }
    h1 { margin: 0; font-size: clamp(32px, 5.8vw, 76px); font-weight: normal; letter-spacing: .04em; line-height: 1.02; text-shadow: 0 3px 24px #0008; }
    h2 { font-size: clamp(26px, 3.4vw, 44px); font-weight: normal; margin: 0 0 .2em; }
    .subtitle { color: #e1bd9e; font-size: clamp(12px, 1.7vw, 22px); line-height: 1.55; max-width: 490px; margin: 1.1em 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 1.3em; }
    button { cursor: pointer; border: 1px solid #b18157; background: #28393c; color: #ffecd0; border-radius: 3px; padding: .85em 1.35em; font-weight: bold; font-size: clamp(10px, 1.12vw, 15px); letter-spacing: .06em; transition: background .12s; }
    button:hover, button:focus-visible { background: #4c544c; outline: 2px solid #ffd690; outline-offset: 3px; }
    button.primary { background: #f2b76c; border-color: #ffdca5; color: #222a2a; }
    button.primary:hover { background: #ffda9e; }
    button:disabled { opacity: .4; cursor: default; }
    .small { font-size: clamp(9px, 1vw, 13px); line-height: 1.6; color: #c2b4a2; }
    .help { max-width: 590px; font-size: clamp(9px, 1.05vw, 14px); line-height: 1.9; color: #bac2bc; margin-top: 1.8em; }
    .stats { display: flex; gap: 2.2em; font-size: clamp(8px, .94vw, 13px); color: #c5bdaa; margin-top: 2em; letter-spacing: .1em; }
    .stats strong { display: block; color: #ffdca3; font-size: 1.6em; margin-bottom: .2em; }
    .topline { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    .wallet { color: #ffd78c; white-space: nowrap; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px; margin-top: 16px; }
    .card { border: 1px solid #79634d; background: linear-gradient(145deg, #293a3b, #1a282e); padding: 14px; border-radius: 3px; }
    .card h3 { font-size: clamp(12px, 1.35vw, 18px); margin: 0 0 7px; font-weight: normal; color: #ffe2ae; }
    .card p { font-size: clamp(9px, .95vw, 13px); font-family: 'Trebuchet MS', Arial, sans-serif; line-height: 1.4; min-height: 2.8em; color: #bfc4b9; margin: 0 0 9px; }
    .card button { width: 100%; padding: .55em; font-size: clamp(9px, .9vw, 12px); }
    .card span { color: #e0ba82; font-size: 11px; }
    .mission-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin: 30px 0 12px; }
    .mission-grid .card { min-height: 245px; display: flex; flex-direction: column; }
    .mission-grid .card p { flex: 1; font-size: clamp(10px, 1.05vw, 14px); line-height: 1.6; }
    .mission-number { font-size: 32px; margin-bottom: 20px; color: #df9a61; }
    .result-lines { font-family: 'Trebuchet MS', Arial, sans-serif; line-height: 2; font-size: clamp(12px, 1.4vw, 18px); color: #d6c8b2; }
    @media (max-width: 850px) { .screen { padding: 3% 5%; } .grid { gap: 6px; margin-top: 7px; } .card { padding: 8px; } .mission-grid { gap: 7px; margin-top: 16px; } .mission-grid .card { min-height: 180px; } .actions { margin-top: .6em; } .help { margin-top: .8em; } }
  </style>
</head>
<body>
  <main id="stage" aria-label="LANTERNWING flight game">
    <canvas id="flight" width="1280" height="720" tabindex="0" aria-label="Flight view. WASD or arrows to fly, E and Q for throttle, Space for lanterns or ring boost, Escape to pause."></canvas>
    <div id="interface" aria-live="polite"></div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
